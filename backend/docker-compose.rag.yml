services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: factory-space-rag-postgres
    environment:
      POSTGRES_DB: factory_space
      POSTGRES_USER: factory_space
      POSTGRES_PASSWORD: factory_space
    ports:
      - "5433:5432"
    volumes:
      - factory_space_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_space -d factory_space"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  factory_space_rag_pgdata:
