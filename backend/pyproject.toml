[project]
name = "factory-space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3,<0.137.0",
    "google-genai>=1.33.0",
    "langgraph>=1.2.2",
    "openai>=1.0.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "Pillow>=10.0.0",
    "edge-tts>=7.0,<8.0",
]

[project.scripts]
factory-space-server = "factory_space_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8.0",
]
# Local (in-process) image generation via diffusers, e.g. SDXL-Turbo.
# Enables FACTORY_IMAGE_GEN_PROVIDER=local. Heavy GPU/ML stack; install with:
#   uv pip install -e ".[image-local]"
image-local = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that depend on external resources or static files",
]
